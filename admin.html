<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Kampung Seburing</title>


<style>

/* =========================
   DASAR
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        sans-serif;

    background:
        #f1f5f3;

    color:
        #1f2937;
}


/* =========================
   LOGIN
========================= */

.login-wrapper {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #087f5b,
            #0bbf7a
        );
}


.login-box {

    width: 100%;

    max-width: 400px;

    background: white;

    padding: 32px;

    border-radius: 22px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.20);
}


.login-icon {

    text-align: center;

    font-size: 50px;

    margin-bottom: 10px;
}


.login-box h2 {

    text-align: center;

    margin: 0;

    color: #087f5b;
}


.login-box p {

    text-align: center;

    color: #64748b;

    font-size: 14px;
}


.login-box input {

    width: 100%;

    padding: 14px;

    margin-top: 12px;

    border: 1px solid #d1d5db;

    border-radius: 10px;

    font-size: 15px;

    outline: none;
}


.login-box input:focus {

    border-color: #087f5b;

    box-shadow:
        0 0 0 3px
        rgba(8,127,91,.1);
}


.login-button {

    width: 100%;

    padding: 14px;

    margin-top: 18px;

    border: none;

    border-radius: 10px;

    background: #087f5b;

    color: white;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;
}


.login-button:hover {

    background: #056b4c;
}


#pesanLogin {

    margin-top: 15px;

    color: #dc2626;

    font-weight: bold;
}



/* =========================
   DASHBOARD
========================= */

#dashboard {

    display: none;

    max-width: 1400px;

    margin: auto;

    padding: 20px;
}


.header {

    background: white;

    padding: 25px;

    border-radius: 18px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.07);
}


.header-top {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap: 15px;

    flex-wrap: wrap;
}


.header h1 {

    margin: 0;

    color: #087f5b;
}


.header p {

    margin: 8px 0 0;

    color: #64748b;
}


.button-area {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 20px;
}


.button-area button {

    border: none;

    padding: 12px 18px;

    border-radius: 10px;

    color: white;

    cursor: pointer;

    font-weight: bold;
}


.refresh-button {

    background: #087f5b;
}


.logout-button {

    background: #dc2626;
}



/* =========================
   STATISTIK
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-top: 20px;
}


.stat-card {

    background: white;

    padding: 20px;

    border-radius: 16px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.06);
}


.stat-card .icon {

    font-size: 30px;
}


.stat-card h3 {

    margin: 8px 0 3px;

    font-size: 28px;
}


.stat-card p {

    margin: 0;

    color: #64748b;
}



/* =========================
   DATA
========================= */

.data-box {

    background: white;

    margin-top: 20px;

    padding: 22px;

    border-radius: 18px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.07);

    overflow-x: auto;
}


.data-box h2 {

    margin-top: 0;

    color: #087f5b;
}



/* =========================
   TABLE
========================= */

table {

    width: 100%;

    min-width: 1200px;

    border-collapse:
        collapse;

    margin-top: 20px;
}


th {

    background: #087f5b;

    color: white;

    padding: 13px;

    text-align: center;

    white-space: nowrap;
}


td {

    padding: 12px;

    border: 1px solid #e5e7eb;

    vertical-align: top;
}


tr:nth-child(even) {

    background:
        #f8fafc;
}



/* =========================
   PESAN
========================= */

.pesan-cell {

    min-width: 250px;

    max-width: 350px;

    white-space: pre-wrap;

    word-break: break-word;
}


.tanggapan-cell {

    min-width: 250px;

    max-width: 350px;

    white-space: pre-wrap;

    word-break: break-word;
}



/* =========================
   TOKEN
========================= */

.token-admin {

    display: inline-block;

    background: #ecfdf5;

    color: #047857;

    padding: 6px 10px;

    border-radius: 8px;

    font-weight: bold;

    font-size: 13px;
}



/* =========================
   STATUS
========================= */

.status-badge {

    display: inline-block;

    padding: 6px 11px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    white-space: nowrap;
}


.status-menunggu {

    background: #fef3c7;

    color: #92400e;
}


.status-diproses {

    background: #dbeafe;

    color: #1d4ed8;
}


.status-selesai {

    background: #dcfce7;

    color: #166534;
}



/* =========================
   BALAS
========================= */

.balas-area {

    min-width: 260px;
}


.balas-area textarea {

    width: 100%;

    min-height: 100px;

    padding: 12px;

    border:
        1px solid #d1d5db;

    border-radius: 10px;

    resize: vertical;

    font-family: Arial;

    font-size: 14px;

    outline: none;
}


.balas-area textarea:focus {

    border-color: #087f5b;
}


.balas-area select {

    width: 100%;

    padding: 11px;

    margin-top: 8px;

    border:
        1px solid #d1d5db;

    border-radius: 10px;

    background: white;
}


.balas-button {

    width: 100%;

    padding: 12px;

    margin-top: 8px;

    border: none;

    border-radius: 10px;

    background: #087f5b;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


.balas-button:hover {

    background: #056b4c;
}


.balas-button:disabled {

    background: #94a3b8;

    cursor: not-allowed;
}


.hasil {

    margin-top: 8px;

    font-size: 13px;

    font-weight: bold;
}



/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    padding: 30px;

    color: #64748b;
}


.error {

    padding: 20px;

    background: #fef2f2;

    color: #b91c1c;

    border-radius: 12px;
}



/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    #dashboard {

        padding: 10px;
    }


    .stats {

        grid-template-columns:
            1fr;
    }


    .header {

        padding: 18px;
    }


    .data-box {

        padding: 12px;
    }

}

</style>

</head>


<body>



<!-- ==================================================
     LOGIN
================================================== -->

<div
    class="login-wrapper"
    id="loginWrapper"
>

    <div class="login-box">

        <div class="login-icon">
            🔐
        </div>


        <h2>
            Admin Kampung Seburing
        </h2>


        <p>
            Silakan login untuk mengelola
            buku tamu dan pengaduan.
        </p>


        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button
            class="login-button"
            onclick="loginAdmin()"
        >
            🔑 Login
        </button>


        <p id="pesanLogin"></p>

    </div>

</div>



<!-- ==================================================
     DASHBOARD
================================================== -->

<div id="dashboard">


    <div class="header">

        <div class="header-top">

            <div>

                <h1>
                    📊 Dashboard Admin
                </h1>

                <p>
                    Kelola buku tamu,
                    pengaduan, dan tanggapan
                    Kampung Seburing.
                </p>

            </div>

        </div>


        <div class="button-area">

            <button
                class="refresh-button"
                onclick="tampilkanData()"
            >
                🔄 Refresh Data
            </button>


            <button
                class="logout-button"
                onclick="logoutAdmin()"
            >
                🚪 Logout
            </button>

        </div>

    </div>



    <!-- ==================================================
         STATISTIK
    ================================================== -->

    <div class="stats">


        <div class="stat-card">

            <div class="icon">
                📩
            </div>

            <h3 id="totalData">
                0
            </h3>

            <p>
                Total Pesan
            </p>

        </div>



        <div class="stat-card">

            <div class="icon">
                ⏳
            </div>

            <h3 id="totalMenunggu">
                0
            </h3>

            <p>
                Menunggu
            </p>

        </div>



        <div class="stat-card">

            <div class="icon">
                ✅
            </div>

            <h3 id="totalSelesai">
                0
            </h3>

            <p>
                Selesai
            </p>

        </div>

    </div>



    <!-- ==================================================
         DATA
    ================================================== -->

    <div class="data-box">

        <h2>
            📋 Data Buku Tamu & Pengaduan
        </h2>


        <div id="dataPengaduan">

            <div class="loading">
                ⏳ Mengambil data...
            </div>

        </div>

    </div>

</div>



<script>


/* ==================================================
   URL GOOGLE APPS SCRIPT
================================================== */

const DATABASE_URL =
"https://script.google.com/macros/s/AKfycbwJJ6MJPyNx5mL-zTAepNMgmd6xjkhQ-Mzmk6MPlAe-AOwAdo9-jeCnCo-aAgNHNF0v-A/exec";



/* ==================================================
   LOGIN
================================================== */

function loginAdmin() {


    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value
        .trim();


    const pesan =
        document
        .getElementById("pesanLogin");


    if (
        username === "admin" &&
        password === "12345"
    ) {


        document
        .getElementById("loginWrapper")
        .style.display = "none";


        document
        .getElementById("dashboard")
        .style.display = "block";


        pesan.innerText = "";


        tampilkanData();


    } else {


        pesan.innerText =
            "❌ Username atau password salah.";

    }

}



/* ==================================================
   AMBIL DATA
================================================== */

async function tampilkanData() {


    const tempat =
        document
        .getElementById("dataPengaduan");


    tempat.innerHTML = `
        <div class="loading">
            ⏳ Mengambil data dari Google Sheet...
        </div>
    `;


    try {


        const response =
            await fetch(
                DATABASE_URL +
                "?action=getData&_=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "DATA GOOGLE SHEET:",
            result
        );


        if (
            !result.success ||
            !Array.isArray(result.data)
        ) {

            throw new Error(
                result.message ||
                "Data Google Sheet tidak valid."
            );

        }


        const data =
            result.data;


        hitungStatistik(data);


        if (data.length === 0) {

            tempat.innerHTML = `
                <div class="loading">
                    📭 Belum ada data.
                </div>
            `;

            return;

        }


        let html = `

        <table>

            <thead>

                <tr>

                    <th>No</th>

                    <th>Nama</th>

                    <th>Alamat</th>

                    <th>Pesan</th>

                    <th>Tanggal</th>

                    <th>Token</th>

                    <th>Status</th>

                    <th>Tanggapan</th>

                    <th>Balas</th>

                </tr>

            </thead>

            <tbody>

        `;


        data.forEach(
            function(item, index) {


                const status =
                    item.status ||
                    "Menunggu";


                html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>


                    <td>
                        ${escapeHTML(
                            item.nama
                        )}
                    </td>


                    <td>
                        ${escapeHTML(
                            item.alamat
                        )}
                    </td>


                    <td class="pesan-cell">

                        ${escapeHTML(
                            item.pesan
                        )}

                    </td>


                    <td>
                        ${escapeHTML(
                            item.tanggal
                        )}
                    </td>


                    <td>

                        <span
                            class="token-admin"
                        >

                            ${escapeHTML(
                                item.token
                            )}

                        </span>

                    </td>


                    <td>

                        ${buatStatus(
                            status
                        )}

                    </td>


                    <td class="tanggapan-cell">

                        ${
                            item.tanggapan
                            ? escapeHTML(
                                item.tanggapan
                            )
                            : "Belum ada tanggapan."
                        }

                    </td>


                    <td class="balas-area">


                        <textarea
                            id="balasan_${index}"
                            placeholder="Tulis tanggapan admin..."
                        ></textarea>


                        <select
                            id="status_${index}"
                        >

                            <option
                                value="Menunggu"
                                ${
                                    status ===
                                    "Menunggu"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Menunggu
                            </option>


                            <option
                                value="Diproses"
                                ${
                                    status ===
                                    "Diproses"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Diproses
                            </option>


                            <option
                                value="Selesai"
                                ${
                                    status ===
                                    "Selesai"
                                    ? "selected"
                                    : ""
                                }
                            >
                                Selesai
                            </option>

                        </select>


                        <button
                            class="balas-button"
                            id="tombol_${index}"
                            onclick="kirimBalasan(
                                '${escapeJS(item.id)}',
                                ${index}
                            )"
                        >

                            💬 Simpan Balasan

                        </button>


                        <div
                            class="hasil"
                            id="hasil_${index}"
                        ></div>


                    </td>

                </tr>

                `;

            }
        );


        html += `

            </tbody>

        </table>

        `;


        tempat.innerHTML =
            html;


    } catch (error) {


        console.error(
            "ERROR:",
            error
        );


        tempat.innerHTML = `

            <div class="error">

                ❌ Gagal mengambil data.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}



/* ==================================================
   STATISTIK
================================================== */

function hitungStatistik(data) {


    document
        .getElementById("totalData")
        .innerText =
        data.length;


    let menunggu = 0;

    let selesai = 0;


    data.forEach(
        function(item) {

            const status =
                String(
                    item.status || ""
                ).toLowerCase();


            if (
                status === "menunggu"
            ) {

                menunggu++;

            }


            if (
                status === "selesai"
            ) {

                selesai++;

            }

        }
    );


    document
        .getElementById("totalMenunggu")
        .innerText =
        menunggu;


    document
        .getElementById("totalSelesai")
        .innerText =
        selesai;

}



/* ==================================================
   STATUS
================================================== */

function buatStatus(status) {


    const value =
        String(status || "")
        .toLowerCase();


    let className =
        "status-menunggu";


    if (
        value === "diproses"
    ) {

        className =
            "status-diproses";

    }


    if (
        value === "selesai"
    ) {

        className =
            "status-selesai";

    }


    return `

        <span
            class="status-badge ${className}"
        >

            ${escapeHTML(status)}

        </span>

    `;

}



/* ==================================================
   KIRIM BALASAN
================================================== */

async function kirimBalasan(
    id,
    index
) {


    const textarea =
        document
        .getElementById(
            "balasan_" + index
        );


    const select =
        document
        .getElementById(
            "status_" + index
        );


    const hasil =
        document
        .getElementById(
            "hasil_" + index
        );


    const tombol =
        document
        .getElementById(
            "tombol_" + index
        );


    const tanggapan =
        textarea
        .value
        .trim();


    const status =
        select.value;


    if (!tanggapan) {

        hasil.style.color =
            "#dc2626";

        hasil.innerText =
            "⚠️ Tulis tanggapan terlebih dahulu.";

        return;

    }


    hasil.style.color =
        "#2563eb";

    hasil.innerText =
        "⏳ Menyimpan...";


    tombol.disabled =
        true;


    try {


        const params =
            new URLSearchParams();


        params.append(
            "action",
            "balas"
        );


        params.append(
            "id",
            id
        );


        params.append(
            "status",
            status
        );


        params.append(
            "tanggapan",
            tanggapan
        );


        const response =
            await fetch(
                DATABASE_URL +
                "?" +
                params.toString()
            );


        const result =
            await response.json();


        console.log(
            "HASIL BALASAN:",
            result
        );


        if (
            result.success
        ) {


            hasil.style.color =
                "#15803d";


            hasil.innerText =
                "✅ Balasan berhasil disimpan.";


            setTimeout(
                function() {

                    tampilkanData();

                },
                800
            );


        } else {


            throw new Error(
                result.message ||
                "Balasan gagal disimpan."
            );

        }


    } catch (error) {


        console.error(
            error
        );


        hasil.style.color =
            "#dc2626";


        hasil.innerText =
            "❌ " +
            error.message;


        tombol.disabled =
            false;

    }

}



/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==================================================
   ESCAPE JAVASCRIPT
================================================== */

function escapeJS(value) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}



/* ==================================================
   LOGOUT
================================================== */

function logoutAdmin() {


    document
        .getElementById(
            "dashboard"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "loginWrapper"
        )
        .style.display =
        "flex";


    document
        .getElementById(
            "username"
        )
        .value =
        "";


    document
        .getElementById(
            "password"
        )
        .value =
        "";

}

</script>

</body>

</html>
