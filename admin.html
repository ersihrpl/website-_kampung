<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Pengaduan</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}


/* =========================
   LOGIN
========================= */

.login-box {

    width: 100%;
    max-width: 400px;

    margin: 80px auto;

    background: white;

    padding: 30px;

    border-radius: 15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.10);

}

.login-box h2 {

    text-align: center;

    margin-top: 0;

}

.login-box input {

    width: 100%;

    padding: 13px;

    margin-top: 12px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 15px;

}

.login-button {

    width: 100%;

    padding: 13px;

    margin-top: 15px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 15px;

    cursor: pointer;

}

.login-button:active {

    transform: scale(0.98);

}

#pesanLogin {

    text-align: center;

    font-size: 14px;

}


/* =========================
   DASHBOARD
========================= */

#dashboard {

    display: none;

    width: 100%;

    max-width: 1300px;

    margin: auto;

}

.header {

    background: white;

    padding: 20px;

    border-radius: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

}

.header h1 {

    margin: 0 0 8px 0;

}

.header p {

    margin: 0;

    color: #666;

}


/* =========================
   BUTTON
========================= */

.button-area {

    display: flex;

    gap: 10px;

    margin-top: 15px;

    flex-wrap: wrap;

}

.button-area button {

    border: none;

    border-radius: 8px;

    padding: 12px 18px;

    color: white;

    cursor: pointer;

    font-size: 14px;

}

.refresh-button {

    background: #2563eb;

}

.logout-button {

    background: #dc2626;

}


/* =========================
   DATA BOX
========================= */

.data-box {

    background: white;

    margin-top: 20px;

    padding: 20px;

    border-radius: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

    overflow-x: auto;

}

.data-box h2 {

    margin-top: 0;

}


/* =========================
   TABLE
========================= */

table {

    width: 100%;

    min-width: 1200px;

    border-collapse: collapse;

    margin-top: 20px;

}

th {

    background: #2563eb;

    color: white;

    padding: 12px;

    border: 1px solid #ddd;

    text-align: center;

    white-space: nowrap;

}

td {

    padding: 10px;

    border: 1px solid #ddd;

    vertical-align: top;

}

tr:nth-child(even) {

    background: #f8fafc;

}


/* =========================
   PENGADUAN
========================= */

.pesan-cell {

    min-width: 250px;

    max-width: 350px;

    white-space: pre-wrap;

    word-break: break-word;

}


/* =========================
   TANGGAPAN
========================= */

.tanggapan-cell {

    min-width: 250px;

    max-width: 350px;

    white-space: pre-wrap;

    word-break: break-word;

}


/* =========================
   BALAS
========================= */

.balas-area {

    min-width: 240px;

}

.balas-area textarea {

    width: 100%;

    height: 90px;

    padding: 10px;

    resize: vertical;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-family: Arial;

    font-size: 14px;

}

.balas-area select {

    width: 100%;

    padding: 10px;

    margin-top: 8px;

    border: 1px solid #ccc;

    border-radius: 8px;

    background: white;

}

.balas-button {

    width: 100%;

    padding: 11px;

    margin-top: 8px;

    border: none;

    border-radius: 8px;

    background: #16a34a;

    color: white;

    cursor: pointer;

    font-size: 14px;

}

.balas-button:active {

    transform: scale(0.98);

}

.hasil {

    margin-top: 8px;

    font-size: 13px;

    font-weight: bold;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {

        padding: 10px;

    }

    .login-box {

        margin: 50px auto;

        padding: 20px;

    }

    .header {

        padding: 15px;

    }

    .data-box {

        padding: 10px;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     LOGIN ADMIN
================================================== -->

<div
    class="login-box"
    id="loginBox"
>

    <h2>🔐 Login Admin</h2>


    <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button
        class="login-button"
        onclick="loginAdmin()"
    >
        Login
    </button>


    <p id="pesanLogin"></p>

</div>



<!-- ==================================================
     DASHBOARD ADMIN
================================================== -->

<div
    id="dashboard"
>


    <div class="header">

        <h1>
            📊 Dashboard Admin
        </h1>

        <p>
            Kelola pengaduan masyarakat
            dan berikan tanggapan.
        </p>


        <div class="button-area">

            <button
                class="refresh-button"
                onclick="tampilkanPengaduan()"
            >
                🔄 Refresh Data
            </button>


            <button
                class="logout-button"
                onclick="logout()"
            >
                🚪 Logout
            </button>

        </div>

    </div>



    <div class="data-box">

        <h2>
            📩 Data Pengaduan Masyarakat
        </h2>


        <div id="dataPengaduan">

            ⏳ Mengambil data...

        </div>

    </div>


</div>



<script>


/* ==================================================
   URL GOOGLE APPS SCRIPT
================================================== */

const DATABASE_URL =
"https://script.google.com/macros/s/AKfycbz5d87vpgUbRlEI9uMlbUnd-1TkJlepogoGn27pF2Wk1X52z5RQ5LsTGzLwifNGL4nOiA/exec";



/* ==================================================
   LOGIN
================================================== */

function loginAdmin() {


    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value
            .trim();


    const pesan =
        document.getElementById(
            "pesanLogin"
        );


    if (
        username === "admin" &&
        password === "12345"
    ) {


        document.getElementById(
            "loginBox"
        ).style.display = "none";


        document.getElementById(
            "dashboard"
        ).style.display = "block";


        pesan.innerText = "";


        tampilkanPengaduan();


    } else {


        pesan.style.color = "red";


        pesan.innerText =
            "❌ Username atau password salah!";


    }

}



/* ==================================================
   AMBIL DATA GOOGLE SHEET
================================================== */

async function tampilkanPengaduan() {


    const tempat =
        document.getElementById(
            "dataPengaduan"
        );


    tempat.innerHTML =
        "⏳ Mengambil data pengaduan...";


    try {


        const response =
            await fetch(

                DATABASE_URL +
                "?action=getData&_=" +
                Date.now()

            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "DATA DARI GOOGLE SHEET:",
            data
        );


        if (
            !Array.isArray(data)
        ) {


            tempat.innerHTML =
                `
                <p style="color:red;">
                    ❌ Data dari server
                    tidak sesuai.
                </p>
                `;


            return;

        }


        if (
            data.length === 0
        ) {


            tempat.innerHTML =
                `
                <p>
                    📭 Belum ada pengaduan.
                </p>
                `;


            return;

        }



        let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        No
                    </th>

                    <th>
                        Nama
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Pengaduan
                    </th>

                    <th>
                        Tanggal
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Tanggapan
                    </th>

                    <th>
                        Balas
                    </th>

                </tr>

            </thead>

            <tbody>

        `;



        data.forEach(
            function(item, index) {


                const status =
                    item.status ||
                    "Pending";


                html += `

                <tr>


                    <td>
                        ${index + 1}
                    </td>


                    <td>
                        ${escapeHTML(
                            item.nama
                        )}
                    </td>


                    <td>
                        ${escapeHTML(
                            item.email
                        )}
                    </td>


                    <td
                        class="pesan-cell"
                    >
                        ${escapeHTML(
                            item.pesan
                        )}
                    </td>


                    <td>
                        ${escapeHTML(
                            item.tanggal
                        )}
                    </td>


                    <td>
                        ${escapeHTML(
                            status
                        )}
                    </td>


                    <td
                        class="tanggapan-cell"
                    >
                        ${escapeHTML(
                            item.tanggapan ||
                            "-"
                        )}
                    </td>


                    <td
                        class="balas-area"
                    >


                        <textarea
                            id="balasan_${index}"
                            placeholder="Tulis balasan admin..."
                        ></textarea>


                        <select
                            id="status_${index}"
                        >

                            <option
                                value="Pending"
                                ${
                                    status ===
                                    "Pending"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Pending
                            </option>


                            <option
                                value="Diproses"
                                ${
                                    status ===
                                    "Diproses"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Diproses
                            </option>


                            <option
                                value="Selesai"
                                ${
                                    status ===
                                    "Selesai"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Selesai
                            </option>

                        </select>


                        <button
                            class="balas-button"
                            onclick="kirimBalasan(
                                '${escapeJS(item.id)}',
                                ${index}
                            )"
                        >
                            💬 Simpan Balasan
                        </button>


                        <div
                            class="hasil"
                            id="hasil_${index}"
                        ></div>


                    </td>


                </tr>

                `;

            }
        );



        html += `

            </tbody>

        </table>

        `;


        tempat.innerHTML =
            html;


    } catch (error) {


        console.error(
            "ERROR DATA:",
            error
        );


        tempat.innerHTML =
            `
            <p style="color:red;">
                ❌ Gagal mengambil data.
            </p>

            <p style="color:#666;">
                ${escapeHTML(
                    error.message
                )}
            </p>
            `;

    }

}



/* ==================================================
   KIRIM BALASAN ADMIN
================================================== */

async function kirimBalasan(
    id,
    index
) {


    const textarea =
        document.getElementById(
            "balasan_" + index
        );


    const select =
        document.getElementById(
            "status_" + index
        );


    const hasil =
        document.getElementById(
            "hasil_" + index
        );


    const tanggapan =
        textarea.value.trim();


    const status =
        select.value;



    if (
        !tanggapan
    ) {


        hasil.style.color =
            "red";


        hasil.innerText =
            "⚠️ Tulis balasan terlebih dahulu.";


        return;

    }



    hasil.style.color =
        "#2563eb";


    hasil.innerText =
        "⏳ Menyimpan balasan...";



    try {


        /*
         * Sesuai dengan doPost()
         * pada Code.gs
         */

        const formData =
            new URLSearchParams();


        formData.append(
            "action",
            "balas"
        );


        formData.append(
            "id",
            id
        );


        formData.append(
            "status",
            status
        );


        formData.append(
            "tanggapan",
            tanggapan
        );



        const response =
            await fetch(

                DATABASE_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/x-www-form-urlencoded"

                    },

                    body:
                        formData.toString()

                }

            );



        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }



        const result =
            await response.json();


        console.log(
            "HASIL BALASAN:",
            result
        );



        if (
            result.success === true
        ) {


            hasil.style.color =
                "green";


            hasil.innerText =
                "✅ Balasan berhasil disimpan!";


            textarea.value = "";


            /*
             * Refresh data
             * setelah berhasil.
             */

            setTimeout(
                function() {

                    tampilkanPengaduan();

                },
                1000
            );


        } else {


            hasil.style.color =
                "red";


            hasil.innerText =
                "❌ " +
                (
                    result.message ||
                    "Gagal menyimpan balasan."
                );

        }


    } catch (error) {


        console.error(
            "ERROR BALAS:",
            error
        );


        hasil.style.color =
            "red";


        hasil.innerText =
            "❌ Gagal menghubungi server: " +
            error.message;

    }

}



/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return "-";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==================================================
   ESCAPE JAVASCRIPT
================================================== */

function escapeJS(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}



/* ==================================================
   LOGOUT
================================================== */

function logout() {


    document.getElementById(
        "dashboard"
    ).style.display =
        "none";


    document.getElementById(
        "loginBox"
    ).style.display =
        "block";


    document.getElementById(
        "username"
    ).value =
        "";


    document.getElementById(
        "password"
    ).value =
        "";


    document.getElementById(
        "pesanLogin"
    ).innerText =
        "";

}

</script>

</body>

</html>
