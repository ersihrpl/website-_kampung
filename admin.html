<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Pengaduan</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        #dashboard {
            display: none;
            max-width: 1000px;
            margin: auto;
        }

        .data-box {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 700px;
        }

        th {
            padding: 10px;
            border: 1px solid #ddd;
            background: #2563eb;
            color: white;
        }

        td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="login-box" id="loginBox">

        <h2>🔐 Login Admin</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="loginAdmin()">
            Login
        </button>

        <p id="pesanLogin"></p>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard">

        <h1>📊 Dashboard Admin</h1>

        <p>Selamat datang di panel admin.</p>

        <button onclick="tampilkanPengaduan()">
            🔄 Refresh Data
        </button>

        <button
            onclick="logout()"
            style="margin-top:10px;background:#dc2626;"
        >
            Logout
        </button>

        <div class="data-box">

            <h2>📩 Data Pengaduan Masyarakat</h2>

            <div id="dataPengaduan">
                Data pengaduan akan tampil di sini.
            </div>

        </div>

    </div>


<script>

/*
=========================================
URL GOOGLE APPS SCRIPT
=========================================
*/

const DATABASE_URL =
"https://script.google.com/macros/s/AKfycbz5d87vpgUbRlEI9uMlbUnd-1TkJlepogoGn27pF2Wk1X52z5RQ5LsTGzLwifNGL4nOiA/exec";


/*
=========================================
LOGIN ADMIN
=========================================
*/

function loginAdmin() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const pesan =
        document.getElementById("pesanLogin");


    if (username === "admin" && password === "12345") {

        document.getElementById("loginBox").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

        pesan.innerText = "";

        tampilkanPengaduan();

    } else {

        pesan.innerText =
            "Username atau password salah!";

        pesan.style.color = "red";
    }
}


/*
=========================================
AMBIL DATA DARI GOOGLE SHEET
=========================================
*/

async function tampilkanPengaduan() {

    const tempatData =
        document.getElementById("dataPengaduan");

    tempatData.innerHTML =
        "⏳ Mengambil data pengaduan...";


    try {

        const response =
            await fetch(DATABASE_URL + "?action=getData", {
                method: "GET",
                cache: "no-cache"
            });


        if (!response.ok) {

            throw new Error(
                "HTTP Error: " + response.status
            );

        }


        const hasil =
            await response.json();


        console.log("HASIL DARI APPS SCRIPT:", hasil);


        /*
        =====================================
        CEK FORMAT DATA
        =====================================
        */

        let data = hasil;


        /*
        Kalau Apps Script mengirim:

        {
            data: [...]
        }

        maka ambil hasil.data
        */

        if (
            hasil &&
            !Array.isArray(hasil) &&
            Array.isArray(hasil.data)
        ) {

            data = hasil.data;

        }


        /*
        Kalau Apps Script mengirim:

        {
            pengaduan: [...]
        }

        */

        if (
            hasil &&
            !Array.isArray(hasil) &&
            Array.isArray(hasil.pengaduan)
        ) {

            data = hasil.pengaduan;

        }


        /*
        =====================================
        CEK DATA
        =====================================
        */

        if (!Array.isArray(data)) {

            tempatData.innerHTML = `
                <p class="error">
                    ❌ Format data dari Google Apps Script
                    tidak sesuai.
                </p>

                <p>
                    Buka Console browser untuk melihat
                    hasil data.
                </p>
            `;

            console.log(
                "FORMAT DATA TIDAK DIKENALI:",
                hasil
            );

            return;
        }


        if (data.length === 0) {

            tempatData.innerHTML =
                "<p>📭 Belum ada pengaduan.</p>";

            return;
        }


        /*
        =====================================
        BUAT TABEL
        =====================================
        */

        let tabel = `

            <table>

                <thead>

                    <tr>

                        <th>No</th>

                        <th>Nama</th>

                        <th>Email</th>

                        <th>Pengaduan</th>

                        <th>Tanggal</th>

                        <th>Status</th>

                        <th>Tanggapan</th>

                    </tr>

                </thead>

                <tbody>

        `;


        data.forEach((item, index) => {

            /*
            Mendukung beberapa kemungkinan
            nama field dari Apps Script.
            */

            const nama =
                item.nama ||
                item.Nama ||
                item.name ||
                "-";


            const email =
                item.email ||
                item.Email ||
                "-";


            const pesan =
                item.pesan ||
                item.Pesan ||
                item.pengaduan ||
                item.Pengaduan ||
                item.message ||
                "-";


            const tanggal =
                item.tanggal ||
                item.Tanggal ||
                "-";


            const status =
                item.status ||
                item.Status ||
                "-";


            const tanggapan =
                item.tanggapan ||
                item.Tanggapan ||
                "-";


            tabel += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHTML(nama)}
                    </td>

                    <td>
                        ${escapeHTML(email)}
                    </td>

                    <td>
                        ${escapeHTML(pesan)}
                    </td>

                    <td>
                        ${escapeHTML(tanggal)}
                    </td>

                    <td>
                        ${escapeHTML(status)}
                    </td>

                    <td>
                        ${escapeHTML(tanggapan)}
                    </td>

                </tr>

            `;

        });


        tabel += `

                </tbody>

            </table>

        `;


        tempatData.innerHTML = tabel;


    } catch (error) {

        console.error(
            "ERROR MENGAMBIL DATA:",
            error
        );


        tempatData.innerHTML = `

            <p class="error">
                ❌ Gagal mengambil data pengaduan.
            </p>

            <p>
                ${escapeHTML(error.message)}
            </p>

        `;

    }

}


/*
=========================================
KEAMANAN TAMPILAN DATA
=========================================
*/

function escapeHTML(value) {

    if (value === null || value === undefined) {

        return "-";

    }

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/*
=========================================
LOGOUT
=========================================
*/

function logout() {

    document.getElementById("dashboard").style.display =
        "none";

    document.getElementById("loginBox").style.display =
        "block";

    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

    document.getElementById("pesanLogin").innerText = "";

    document.getElementById("dataPengaduan").innerHTML =
        "Data pengaduan akan tampil di sini.";

}

</script>

</body>
</html>
